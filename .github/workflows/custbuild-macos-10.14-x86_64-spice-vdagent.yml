name: Build spice-vdagent for Mac OS X 10.14 platform  x86_64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS x86_64 / Mojave-compatible
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.14"
      GETTEXT_VERSION: "0.22.5"
      PCRE2_VERSION: "10.44"
      GLIB_VERSION: "2.82.2"

    steps:
      - name: Checkout upstream vd_agent
        uses: actions/checkout@v4
        with:
          repository: utmapp/vd_agent
          # Immutable commit corresponding to upstream release:
          # spice-vdagent-0.22.1-macOS
          ref: 5ccfc993f40ab7f0bd6dfd458e41e0b6f4f8c070
          submodules: recursive

      - name: Show build environment
        run: |
          set -euxo pipefail

          echo "Architecture:"
          uname -m

          echo "macOS:"
          sw_vers

          echo "Xcode:"
          xcodebuild -version

          echo "SDK:"
          xcrun --sdk macosx --show-sdk-version

          echo "Homebrew:"
          brew --prefix

          test "$(uname -m)" = "x86_64"

      - name: Prepare build environment
        run: |
          set -euxo pipefail

          echo "DEPS_PREFIX=$RUNNER_TEMP/vdagent-mojave-deps" >> "$GITHUB_ENV"

          # Build tools only. Runtime/static dependencies are built from source
          # below with an explicit macOS 10.14 deployment target.
          brew install meson ninja pkgconf cmake

          MOJAVE_FDSET_HEADER="$RUNNER_TEMP/algites-mojave-fdset-compat.h"
          echo "MOJAVE_FDSET_HEADER=$MOJAVE_FDSET_HEADER" >> "$GITHUB_ENV"

          cat > "$MOJAVE_FDSET_HEADER" <<'EOF'
          #ifndef ALGITES_MOJAVE_FDSET_COMPAT_H
          #define ALGITES_MOJAVE_FDSET_COMPAT_H

          /*
           * Build compatibility for macOS 10.14 Mojave while compiling with
           * a modern macOS SDK.
           *
           * Modern Darwin headers implement FD_SET/FD_CLR/FD_ISSET through
           * __darwin_check_fd_set_overflow(), which is not present on Mojave.
           * Mojave itself manipulated fd_set.fds_bits directly.
           *
           * Force the Mojave-compatible operations for every C/C++ translation
           * unit in this custom build, not just GLib's gpoll.c.
           */
          #include <sys/select.h>

          #if defined(__APPLE__)
          #undef FD_SET
          #undef FD_CLR
          #undef FD_ISSET

          static __inline void
          algites_mojave_fd_set(int fd, fd_set *set)
          {
              const unsigned long nfdbits = sizeof(set->fds_bits[0]) * 8UL;
              set->fds_bits[(unsigned long)fd / nfdbits] |=
                  (__int32_t)(((unsigned long)1) << ((unsigned long)fd % nfdbits));
          }

          static __inline void
          algites_mojave_fd_clr(int fd, fd_set *set)
          {
              const unsigned long nfdbits = sizeof(set->fds_bits[0]) * 8UL;
              set->fds_bits[(unsigned long)fd / nfdbits] &=
                  ~(__int32_t)(((unsigned long)1) << ((unsigned long)fd % nfdbits));
          }

          static __inline int
          algites_mojave_fd_isset(int fd, const fd_set *set)
          {
              const unsigned long nfdbits = sizeof(set->fds_bits[0]) * 8UL;
              return set->fds_bits[(unsigned long)fd / nfdbits] &
                  (__int32_t)(((unsigned long)1) << ((unsigned long)fd % nfdbits));
          }

          #define FD_SET(fd, set)   algites_mojave_fd_set((fd), (set))
          #define FD_CLR(fd, set)   algites_mojave_fd_clr((fd), (set))
          #define FD_ISSET(fd, set) algites_mojave_fd_isset((fd), (set))
          #endif

          #endif
          EOF

          cat "$MOJAVE_FDSET_HEADER"

      - name: Build gettext for Mojave
        run: |
          set -euxo pipefail

          mkdir -p "$DEPS_PREFIX"
          cd "$RUNNER_TEMP"

          curl -fL \
            "https://ftp.gnu.org/gnu/gettext/gettext-${GETTEXT_VERSION}.tar.xz" \
            -o "gettext-${GETTEXT_VERSION}.tar.xz"

          tar -xf "gettext-${GETTEXT_VERSION}.tar.xz"
          cd "gettext-${GETTEXT_VERSION}"

          export CC=clang
          export CXX=clang++
          # Do not force the fd_set compatibility header into Autoconf/gnulib
          # feature-detection probes. Gettext is built only with the Mojave
          # deployment target; the later nm verification will tell us if
          # libintl itself introduces the incompatible Darwin symbol.
          export CFLAGS="-O2 -arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          export CXXFLAGS="-O2 -arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          export CPPFLAGS="-I${DEPS_PREFIX}/include"
          export LDFLAGS="-arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -L${DEPS_PREFIX}/lib"

          ./configure \
            --prefix="$DEPS_PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(sysctl -n hw.ncpu)"
          make install

          test -f "$DEPS_PREFIX/lib/libintl.a"
          file "$DEPS_PREFIX/lib/libintl.a"

      - name: Build PCRE2 for Mojave
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          git clone \
            --depth 1 \
            --branch "pcre2-${PCRE2_VERSION}" \
            https://github.com/PCRE2Project/pcre2.git \
            "pcre2-${PCRE2_VERSION}"

          cd "pcre2-${PCRE2_VERSION}"

          # PCRE2 does not need the fd_set compatibility header. Keep its
          # configuration probes clean and rely on the later nm verification
          # to detect any Mojave-incompatible undefined symbol.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_BUILD_PCRE2_8=ON \
            -DPCRE2_BUILD_PCRE2_16=OFF \
            -DPCRE2_BUILD_PCRE2_32=OFF \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF

          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          cmake --install build

          test -f "$DEPS_PREFIX/lib/libpcre2-8.a"
          file "$DEPS_PREFIX/lib/libpcre2-8.a"

          if find "$DEPS_PREFIX/lib" -maxdepth 1 \
              \( -name 'libpcre2*.dylib' -o -name 'libpcre2*.so' \) \
              -print -quit | grep -q .
          then
            echo "::error::PCRE2 build unexpectedly installed a shared library"
            exit 1
          fi

      - name: Build GLib for Mojave
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -fL \
            "https://download.gnome.org/sources/glib/2.82/glib-${GLIB_VERSION}.tar.xz" \
            -o "glib-${GLIB_VERSION}.tar.xz"

          tar -xf "glib-${GLIB_VERSION}.tar.xz"
          cd "glib-${GLIB_VERSION}"

          # Compile all GLib/GIO sources with the Mojave fd_set compatibility
          # header created above. This avoids relying on a source-file-specific
          # patch and covers any FD_SET/FD_ISSET use in all static GLib libraries.
          export CC=clang
          export CXX=clang++
          export CFLAGS="-O2 -arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -include ${MOJAVE_FDSET_HEADER}"
          export CXXFLAGS="-O2 -arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -include ${MOJAVE_FDSET_HEADER}"
          export CPPFLAGS="-I${DEPS_PREFIX}/include"
          export LDFLAGS="-arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -L${DEPS_PREFIX}/lib"

          # Put only our Mojave-targeted dependencies first. In particular,
          # GLib must resolve PCRE2 to the static library built above rather
          # than to a current Homebrew/system PCRE2 dylib.
          export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig"

          meson setup build \
            --prefix="$DEPS_PREFIX" \
            --default-library=static \
            -Dtests=false \
            -Dinstalled_tests=false \
            -Dintrospection=disabled \
            -Ddtrace=disabled \
            -Dsystemtap=disabled \
            -Dsysprof=disabled \
            -Ddocumentation=false \
            -Dman-pages=disabled \
            -Dlibmount=disabled \
            -Dselinux=disabled

          meson compile -C build
          meson install -C build

          for lib in \
            libgio-2.0.a \
            libglib-2.0.a \
            libgobject-2.0.a \
            libgmodule-2.0.a
          do
            test -f "$DEPS_PREFIX/lib/$lib"
            file "$DEPS_PREFIX/lib/$lib"
          done

      - name: Verify static dependencies for Mojave
        run: |
          set -euxo pipefail

          for lib in \
            libintl.a \
            libpcre2-8.a \
            libgio-2.0.a \
            libglib-2.0.a \
            libgobject-2.0.a \
            libgmodule-2.0.a
          do
            path="$DEPS_PREFIX/lib/$lib"
            test -f "$path"

            echo
            echo "Checking $path"

            refs="$(nm -u "$path" \
              | grep '___darwin_check_fd_set_overflow' || true)"

            if [ -n "$refs" ]; then
              echo "$refs"
              echo "::error::Mojave-incompatible fd_set overflow symbol is present in $lib"
              exit 1
            fi
          done

          echo "All custom static dependencies are free of the Mojave-incompatible fd_set symbol."

      - name: Adapt upstream Xcode project for Intel Mojave dependencies
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          prefix = os.environ["DEPS_PREFIX"]
          path = Path("vd_agent.xcodeproj/project.pbxproj")
          text = path.read_text()

          # Use headers and libraries built above for macOS 10.14.
          text = text.replace("/opt/homebrew", prefix)

          text = text.replace(
              'intel_input=\"/usr/local/lib/$name\"',
              f'intel_input=\"{prefix}/lib/$name\"',
          )

          # Upstream adds libpcre2-8.tbd from the current macOS SDK to
          # both Frameworks build phases. Merely changing the PBXFileReference
          # is not sufficient: Xcode may still normalize that SDK library into
          # -lpcre2-8 and resolve it back to the SDK dylib.
          #
          # Remove every PBX project line referring to the SDK PCRE2 entry.
          # The pinned upstream project contains exactly six such lines:
          #   - 2 PBXBuildFile declarations
          #   - 1 PBXFileReference declaration
          #   - 2 Frameworks build-phase entries
          #   - 1 Frameworks group entry
          pcre2_lines = [
              line for line in text.splitlines()
              if "libpcre2-8.tbd" in line
          ]

          print("Removing SDK PCRE2 project entries:")
          for line in pcre2_lines:
              print(line)

          if len(pcre2_lines) != 6:
              raise SystemExit(
                  f"Expected exactly 6 SDK PCRE2 project lines, found {len(pcre2_lines)}"
              )

          text = "\n".join(
              line for line in text.splitlines()
              if "libpcre2-8.tbd" not in line
          ) + "\n"

          # Upstream combines Intel and ARM Homebrew static libraries with lipo.
          # This custom build intentionally produces x86_64 only.
          old = r'lipo -output \"$tmp_output\" -create \"$intel_input\" \"$arm64_input\"'
          new = r'cp \"$intel_input\" \"$tmp_output\"'

          count = text.count(old)
          print(f"Found {count} universal-library lipo commands")

          if count != 2:
              raise SystemExit(
                  f"Expected exactly 2 lipo commands in upstream Xcode project, found {count}"
              )

          text = text.replace(old, new)
          path.write_text(text)

          # Hard verification of the patched project: the current SDK PCRE2
          # must no longer appear anywhere in project.pbxproj.
          patched = path.read_text()
          if "libpcre2-8.tbd" in patched:
              raise SystemExit("SDK PCRE2 reference still present after patch")
          PY

      - name: Verify patched Xcode project
        run: |
          set -euxo pipefail

          if grep -n 'libpcre2-8\.tbd' vd_agent.xcodeproj/project.pbxproj
          then
            echo "::error::SDK PCRE2 is still referenced by the Xcode project"
            exit 1
          fi

          echo "No SDK PCRE2 reference remains in project.pbxproj."

      - name: Build macOS fd_set runtime compatibility shim
        run: |
          set -euxo pipefail

          SHIM_SOURCE="$RUNNER_TEMP/algites-macos-fdset-shim.c"
          SHIM_OBJECT="$RUNNER_TEMP/algites-macos-fdset-shim.o"

          cat > "$SHIM_SOURCE" <<'EOF'
          /*
           * Compatibility shim for binaries built with modern Apple SDKs but
           * targeting macOS 10.14 Mojave and later.
           *
           * Modern Darwin FD_SET/FD_CLR/FD_ISSET helpers call
           * __darwin_check_fd_set_overflow(), which is unavailable on Mojave.
           *
           * On macOS 11 and later, delegate to Apple's real implementation
           * through RTLD_NEXT. On Mojave, where that symbol is absent, return
           * 1 to reproduce the pre-macOS-11 fd_set behaviour.
           */
          #include <dlfcn.h>
          #include <pthread.h>
          #include <stddef.h>

          typedef int (*darwin_fd_set_overflow_fn)(
              int fd,
              const void *fdset,
              int unlimited);

          static darwin_fd_set_overflow_fn real_darwin_fd_set_overflow = NULL;
          static pthread_once_t resolve_once = PTHREAD_ONCE_INIT;

          static void
          resolve_darwin_fd_set_overflow(void)
          {
              real_darwin_fd_set_overflow =
                  (darwin_fd_set_overflow_fn)
                  dlsym(RTLD_NEXT, "__darwin_check_fd_set_overflow");
          }

          int
          __darwin_check_fd_set_overflow(
              int fd,
              const void *fdset,
              int unlimited)
          {
              (void)pthread_once(
                  &resolve_once,
                  resolve_darwin_fd_set_overflow);

              if (real_darwin_fd_set_overflow != NULL) {
                  return real_darwin_fd_set_overflow(
                      fd,
                      fdset,
                      unlimited);
              }

              /* macOS 10.14 Mojave fallback. */
              (void)fd;
              (void)fdset;
              (void)unlimited;
              return 1;
          }
          EOF

          clang \
            -c \
            -O2 \
            -arch x86_64 \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SHIM_SOURCE" \
            -o "$SHIM_OBJECT"

          file "$SHIM_OBJECT"

          shim_symbol="$(nm -m "$SHIM_OBJECT" \
            | grep '___darwin_check_fd_set_overflow' || true)"

          echo "$shim_symbol"

          if [ -z "$shim_symbol" ] || echo "$shim_symbol" | grep -q '(undefined)'
          then
            echo "::error::macOS fd_set compatibility shim does not define the required symbol"
            exit 1
          fi

          echo "MOJAVE_FDSET_SHIM_OBJECT=$SHIM_OBJECT" >> "$GITHUB_ENV"

      - name: Build x86_64 archive
        run: |
          set -euxo pipefail

          PCRE2_STATIC="$DEPS_PREFIX/lib/libpcre2-8.a"

          test -f "$PCRE2_STATIC"
          test -f "$MOJAVE_FDSET_SHIM_OBJECT"

          # The SDK PCRE2 was removed from both Frameworks phases above.
          # Force-load our macOS-10.14-targeted archive explicitly so that
          # unresolved PCRE2 symbols from static GLib are resolved regardless
          # of archive ordering in Xcode's generated linker command.
          #
          # Link the fd_set compatibility shim directly into both
          # executables. On Mojave it supplies the missing symbol; on macOS 11+
          # it delegates to Apple's implementation through RTLD_NEXT.
          xcodebuild archive \
            -scheme vd_agent \
            -configuration Release \
            -archivePath "$PWD/vd_agent.xcarchive" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="$MOJAVE_FDSET_SHIM_OBJECT -Wl,-force_load,$PCRE2_STATIC"

      - name: Verify result
        run: |
          set -euxo pipefail

          DAEMON="$PWD/vd_agent.xcarchive/Products/usr/local/bin/spice-vdagentd"
          AGENT="$PWD/vd_agent.xcarchive/Products/usr/local/bin/spice-vdagent"

          test -f "$DAEMON"
          test -f "$AGENT"

          for executable in "$DAEMON" "$AGENT"
          do
            echo
            echo "============================================================"
            echo "$executable"
            echo "============================================================"

            file "$executable"

            archs="$(lipo -archs "$executable")"
            echo "Architectures: $archs"
            test "$archs" = "x86_64"

            echo
            echo "Mach-O build version:"
            build_info="$(xcrun vtool -show-build "$executable")"
            echo "$build_info"
            echo "$build_info" | grep -q 'minos 10.14'

            echo
            echo "Dynamic dependencies:"
            deps="$(otool -L "$executable")"
            echo "$deps"

            if echo "$deps" | tail -n +2 \
                | grep -E '/usr/local|/opt/homebrew|libpcre2' >/dev/null
            then
              echo "::error::Found a non-Mojave build-time dependency in final executable"
              exit 1
            fi

            echo
            echo "fd_set overflow compatibility symbol:"
            refs="$(nm -m "$executable" \
              | grep '___darwin_check_fd_set_overflow' || true)"

            if [ -n "$refs" ]; then
              echo "$refs"

              if echo "$refs" | grep -q '(undefined)'
              then
                echo "::error::Found an undefined Mojave-incompatible ___darwin_check_fd_set_overflow import"
                exit 1
              fi

              echo "The fd_set compatibility symbol is resolved locally."
            else
              echo "No fd_set overflow compatibility symbol is referenced."
            fi

            # The only unsafe state for Mojave is an unresolved dynamic import.
            # A completely absent symbol is ideal; a locally resolved shim is
            # also valid.
            if nm -u "$executable" \
                | grep -q '___darwin_check_fd_set_overflow'
            then
              echo "::error::Final executable still imports ___darwin_check_fd_set_overflow"
              exit 1
            fi
          done

      - name: Prepare result
        run: |
          set -euxo pipefail

          mkdir -p output

          cp \
            vd_agent.xcarchive/Products/usr/local/bin/spice-vdagentd \
            output/

          cp \
            vd_agent.xcarchive/Products/usr/local/bin/spice-vdagent \
            output/

      - name: Upload x86_64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: spice-vdagent-macos-x86_64-mojave
          path: output/
     